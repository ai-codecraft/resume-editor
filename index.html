<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历工坊 — 大学生求职简历编辑器</title>
  <meta name="description" content="免费在线简历编辑器，专为大学生求职设计。实时预览、多模板切换、一键导出PDF，数据本地存储，隐私安全。">
  <meta name="keywords" content="简历编辑器,大学生简历,求职简历,在线简历,简历模板,PDF简历">
  <meta name="author" content="简历工坊">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=1.3">
  <link rel="stylesheet" href="css/templates.css?v=1.3">
  <link rel="stylesheet" href="css/print.css?v=1.4" media="print">
</head>
<body>
  <div id="app">
    <!-- ==================== TOOLBAR ==================== -->
    <header id="toolbar">
      <!-- Left: Logo + App name -->
      <div class="toolbar-left">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="24" height="24" rx="6" fill="var(--accent)" opacity="0.15"/>
            <rect x="4" y="4" width="20" height="20" rx="4" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
            <path d="M9 9h10M9 13h10M9 17h6" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="19" cy="17" r="2" fill="var(--accent)"/>
          </svg>
        </div>
        <h1 class="app-title">简历工坊</h1>
      </div>

      <!-- Center: Resume version + template + theme controls -->
      <div class="toolbar-center">
        <div class="toolbar-group resume-version-group">
          <label for="resume-version-select">岗位版本</label>
          <select id="resume-version-select" aria-label="选择岗位定向简历版本"></select>
          <span id="resume-version-hint" class="resume-version-hint" title=""></span>
        </div>

        <div class="toolbar-group">
          <label for="template-select">模板</label>
          <select id="template-select">
            <option value="classic-zh" selected>经典中文</option>
            <option value="modern">极简现代</option>
            <option value="classic">专业经典</option>
            <option value="academic">学术优雅</option>
          </select>
        </div>

        <div class="toolbar-group">
          <label for="font-family-select">字体</label>
          <select id="font-family-select">
            <option value="sans-serif" selected>极简无衬线</option>
            <option value="serif">优雅衬线体</option>
            <option value="kaiti">人文楷体</option>
            <option value="xingkai">艺术行楷</option>
          </select>
        </div>

        <div class="toolbar-group">
          <label>主题色</label>
          <div class="color-presets">
            <button class="color-preset active" data-color="#6366f1" style="--preset-color:#6366f1" title="靛蓝" aria-label="靛蓝主题色"></button>
            <button class="color-preset" data-color="#3b82f6" style="--preset-color:#3b82f6" title="蓝色" aria-label="蓝色主题色"></button>
            <button class="color-preset" data-color="#06b6d4" style="--preset-color:#06b6d4" title="青色" aria-label="青色主题色"></button>
            <button class="color-preset" data-color="#10b981" style="--preset-color:#10b981" title="翠绿" aria-label="翠绿主题色"></button>
            <button class="color-preset" data-color="#f59e0b" style="--preset-color:#f59e0b" title="琥珀" aria-label="琥珀主题色"></button>
            <button class="color-preset" data-color="#ef4444" style="--preset-color:#ef4444" title="红色" aria-label="红色主题色"></button>
            <button class="color-preset" data-color="#ec4899" style="--preset-color:#ec4899" title="粉色" aria-label="粉色主题色"></button>
            <button class="color-preset" data-color="#8b5cf6" style="--preset-color:#8b5cf6" title="紫色" aria-label="紫色主题色"></button>
          </div>
          <input type="color" id="theme-color-input" value="#6366f1" title="自定义颜色">
        </div>

        <div class="toolbar-group">
          <label for="font-size-range">字号</label>
          <input type="range" id="font-size-range" min="12" max="16" value="14" step="0.5">
          <input type="number" id="font-size-input" class="range-number-input" min="12" max="16" value="14" step="0.5" inputmode="decimal" aria-label="手动输入字号">
          <span class="range-unit">px</span>
        </div>

        <div class="toolbar-group">
          <label for="line-height-range">行高</label>
          <input type="range" id="line-height-range" min="1.2" max="1.8" value="1.5" step="0.05">
          <span class="range-value" id="line-height-value">1.5</span>
        </div>

        <div class="toolbar-group">
          <label for="margin-select">页边距</label>
          <select id="margin-select">
            <option value="compact">紧凑</option>
            <option value="standard" selected>标准</option>
            <option value="loose">宽松</option>
          </select>
        </div>
      </div>

      <!-- Right: Action buttons -->
      <div class="toolbar-right">
        <span id="save-status" class="save-status" style="font-size: 12px; color: var(--text-secondary, #888); opacity: 0; transition: opacity 0.5s ease; margin-right: 8px; font-weight: 500; pointer-events: none; white-space: nowrap;">已保存 ✓</span>
        <button id="dark-mode-toggle" class="toolbar-btn" title="切换明暗模式">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.003 8.003 0 1010.586 10.586z" fill="currentColor"/>
          </svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
            <circle cx="10" cy="10" r="4" fill="currentColor"/>
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.93 4.93l1.41 1.41M13.66 13.66l1.41 1.41M4.93 15.07l1.41-1.41M13.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>

        <button id="import-json-btn" class="toolbar-btn" title="导入数据">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 14v3a1 1 0 001 1h12a1 1 0 001-1v-3M14 7l-4-4m0 0L6 7m4-4v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>导入</span>
        </button>
        <input type="file" id="import-json-input" accept=".json" hidden>

        <button id="export-json-btn" class="toolbar-btn" title="导出数据">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 14v3a1 1 0 001 1h12a1 1 0 001-1v-3M10 3v12m0 0l4-4m-4 4l-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>导出</span>
        </button>

        <button id="reset-btn" class="toolbar-btn" title="重置数据">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4v5h5M16 16v-5h-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15.66 7A7 7 0 004.34 5.34L4 9M4.34 13A7 7 0 0015.66 14.66L16 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>重置</span>
        </button>

        <button id="fit-page-btn" class="toolbar-btn" title="智能拉伸或压缩排版以填满单页且不跨页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="10" y1="14" x2="3" y2="21"></line>
          </svg>
          <span>适应整页</span>
        </button>

        <button id="export-pdf-btn" class="toolbar-btn primary" title="导出PDF">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.828a2 2 0 00-.586-1.414l-3.828-3.828A2 2 0 0010.172 2H6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M7 11h2.5M7 14h6M13 7h-3V4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>导出 PDF</span>
        </button>
      </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main id="main-content">
      <!-- LEFT: Editor Panel -->
      <aside id="editor-panel">
        <div id="editor-sections">
          <!-- Sections dynamically generated by editor.js. -->
          <!-- Loading placeholder -->
          <div class="editor-loading" id="editor-loading">
            <div class="editor-loading-shimmer"></div>
            <div class="editor-loading-shimmer short"></div>
            <div class="editor-loading-shimmer"></div>
            <div class="editor-loading-shimmer shorter"></div>
          </div>
        </div>
        <button id="btn-add-custom-section" class="add-section-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>添加自定义板块</span>
        </button>
      </aside>

      <!-- RIGHT: Preview Panel -->
      <section id="preview-panel">
        <div id="preview-container">
          <div id="resume-preview" class="resume-page template-modern">
            <!-- Resume content dynamically generated by preview.js -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ADD CUSTOM SECTION MODAL -->
  <div id="add-section-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 class="modal-title">添加自定义板块</h3>
      <p class="modal-text" style="font-size: 12px; margin-bottom: 16px; color: var(--text-secondary);">为您的简历添加一个新的经历或内容版块。</p>
      
      <div class="form-group" style="margin-bottom: 14px;">
        <label class="field-label" for="new-section-title" style="display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px;">板块名称</label>
        <input type="text" id="new-section-title" class="editor-input" placeholder="如：实习经历、学术研究、社会实践" style="width: 100%;" />
      </div>
      
      <div class="form-group" style="margin-bottom: 20px;">
        <label class="field-label" for="new-section-type" style="display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px;">板块类型</label>
        <select id="new-section-type" class="editor-input editor-select" style="width: 100%;">
          <option value="list">列表型 (包含多个经历子项，每个子项有时间、名称、描述)</option>
          <option value="text">文本型 (单段纯文本，适合自我介绍、个人陈述等)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button id="modal-cancel-btn" class="modal-btn">取消</button>
        <button id="modal-confirm-btn" class="modal-btn primary">确认添加</button>
      </div>
    </div>
  </div>

  <!-- CUSTOM CONFIRM MODAL -->
  <div id="custom-confirm-modal" class="modal-overlay" style="display: none; z-index: 1100;">
    <div class="modal-content" style="max-width: 400px;">
      <h3 class="modal-title" id="confirm-title">提示</h3>
      <p class="modal-text" id="confirm-message" style="font-size: 14px; line-height: 1.5; margin-bottom: 20px; color: var(--text-primary); text-align: left;"></p>
      <div class="modal-actions">
        <button id="confirm-cancel-btn" class="modal-btn">取消</button>
        <button id="confirm-ok-btn" class="modal-btn primary">确定</button>
      </div>
    </div>
  </div>

  <!-- PRINT GUIDE MODAL -->
  <div id="print-guide-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 480px;">
      <h3 class="modal-title">导出 PDF 重要提示</h3>
      <p class="modal-text" style="font-size: 13px; line-height: 1.5; margin-bottom: 16px; color: var(--text-secondary);">
        为了确保简历在导出为 PDF 时能够<strong>完美适配单页</strong>且<strong>色彩显示完整</strong>，请在接下来的系统打印预览窗口中进行如下设置：
      </p>
      
      <div class="guide-steps" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
        <div class="guide-step" style="display: flex; align-items: flex-start; gap: 10px;">
          <div style="background: var(--accent-subtle); color: var(--accent); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; font-size: 12px;">1</div>
          <div style="text-align: left;">
            <strong style="color: var(--text-primary); font-size: 13px; display: block; margin-bottom: 2px;">将“页边距”设置为“无”（或 None）</strong>
            <span style="font-size: 12px; color: var(--text-muted); display: block; line-height: 1.4;">极度重要！默认边距会导致页面被强行压缩并产生多余的空白页。</span>
          </div>
        </div>
        <div class="guide-step" style="display: flex; align-items: flex-start; gap: 10px;">
          <div style="background: var(--accent-subtle); color: var(--accent); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; font-size: 12px;">2</div>
          <div style="text-align: left;">
            <strong style="color: var(--text-primary); font-size: 13px; display: block; margin-bottom: 2px;">勾选“背景图形”（Background graphics）</strong>
            <span style="font-size: 12px; color: var(--text-muted); display: block; line-height: 1.4;">用于完整渲染板块图标背景、证件照片和主题线色彩。</span>
          </div>
        </div>
        <div class="guide-step" style="display: flex; align-items: flex-start; gap: 10px;">
          <div style="background: var(--accent-subtle); color: var(--accent); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; font-size: 12px;">3</div>
          <div style="text-align: left;">
            <strong style="color: var(--text-primary); font-size: 13px; display: block; margin-bottom: 2px;">“纸张大小”选择“A4”</strong>
            <span style="font-size: 12px; color: var(--text-muted); display: block; line-height: 1.4;">确保简历尺寸与国际标准 A4 规格（210mm × 297mm）完全贴合。</span>
          </div>
        </div>
      </div>
      
      <div class="modal-actions">
        <button id="guide-cancel-btn" class="modal-btn">取消</button>
        <button id="guide-print-btn" class="modal-btn">系统打印 (备用)</button>
        <button id="guide-download-btn" class="modal-btn primary">直接下载 PDF (推荐)</button>
      </div>
    </div>
  </div>

  <!-- Scripts in dependency order -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/storage.js?v=1.6"></script>
  <script src="js/resume-versions-target.js?v=7.8"></script>
  <script src="js/dragdrop.js?v=1.5"></script>
  <script src="js/templates.js?v=2.0"></script>
  <script src="js/editor.js?v=1.6"></script>
  <script src="js/preview.js?v=1.6"></script>
  <script src="js/app.js?v=1.7"></script>
</body>
</html>
